<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    La base la reemplaza `flutter build web --base-href /ruta/` (debe empezar y
    terminar con «/»). Con scripts/construir_pwa.ps1 queda en «/».
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Tu espacio de concentración, calma e inspiración.">
  <meta name="theme-color" content="#5b011d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16060d" media="(prefers-color-scheme: dark)">

  <!-- Instalación en iOS (Safari no lee el manifiesto para esto) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CEOSMOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>CEOSMOS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #fff8f3; }
    @media (prefers-color-scheme: dark) { html, body { background: #16060d; } }
    #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; font: 600 16px system-ui, sans-serif; color: #5b011d; }
    @media (prefers-color-scheme: dark) { #carga { color: #fceff3; } }
    #carga img { width: 72px; height: 72px; border-radius: 18px; }
    #carga .barra { width: 120px; height: 4px; border-radius: 2px; background: currentColor; opacity: .25;
      animation: pulso 1.2s ease-in-out infinite; }
    @keyframes pulso { 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { #carga .barra { animation: none; } }
  </style>
</head>
<body>
  <div id="carga" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <span>Cargando CEOSMOS…</span>
    <div class="barra"></div>
  </div>
  <noscript>CEOSMOS necesita JavaScript activado para funcionar.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
